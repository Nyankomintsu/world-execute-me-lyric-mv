<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>world.execute(me);</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #b9cfe3; font: 13px/1.5 Consolas, "JetBrains Mono", monospace; }
  /* the picture fills the window at 16:9, black bars on the longer side */
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas#view { display: block; width: min(100vw, 100vh * 16 / 9); height: min(100vh, 100vw * 9 / 16); background: #000; }
  @supports (height: 100dvh) { canvas#view { width: min(100vw, 100dvh * 16 / 9); height: min(100dvh, 100vw * 9 / 16); } }
  body.idle, body.idle * { cursor: none; }
  body.export #stage { position: static; display: block; }
  body.export canvas#view { width: auto; height: auto; }
  body.export #error { display: none; }
  /* the warning page fades in from black with its first frame (src/main.js) */
  canvas#view:not(.on) { opacity: 0; }
  canvas#view { transition: opacity 0.4s; }
  body.export canvas#view { transition: none; opacity: 1; }
  /* only when the film cannot start */
  #error { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80vw; color: #e8788f; white-space: pre-wrap; }
</style>
</head>
<body class="idle">
<div id="stage"><canvas id="view"></canvas></div>
<div id="error" hidden></div>
<audio id="audio" preload="auto"></audio>
<script type="module" src="src/main.js"></script>
</body>
</html>
